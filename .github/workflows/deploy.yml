name: Deploy to Krystal FTPS
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 3-31/4 * *'
jobs:
  deploy:
    if: "github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'Nightly') || startsWith(github.event.head_commit.message, 'chore: morning audit') || startsWith(github.event.head_commit.message, 'Merge origin/main'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTP-Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: p125.lon.krystal.io
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            README.md
            assets/partials.html
            AGENTS.md
            INGESTION.md
            DEPLOYMENT.md
            CLAUDE.md
            TEMPLATES/**
            scripts/**
            reports/**
            docs/**
            config/**
            status*.json
            build.py
            build.mjs
            **/*.py
            **/*.mjs
            **/*.sh
            **/*.md
            **/*.env
